name: omni_chat
description: Personal multi-provider AI chat with skills, files and images.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <5.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0
  image_picker: ^1.1.0
  file_picker: ^8.1.0
  flutter_markdown: ^0.7.4
  archive: ^3.6.0
  webview_flutter: ^4.10.0
  markdown: ^7.2.0
  webview_flutter_android: ^4.0.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Regenerated into the freshly-created android/ project on every CI build (see
# .github/workflows/build-apk.yml) by `dart run flutter_launcher_icons` - android/ itself is not
# committed, so without this step every build would ship Flutter's default launcher icon.
flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
