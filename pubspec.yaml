name: omni_chat
description: Personal multi-provider AI chat with skills, files and images.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <5.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0
  image_picker: ^1.1.0
  file_picker: ^8.1.0
  flutter_markdown: ^0.7.4
  archive: ^3.6.0
  webview_flutter: ^4.10.0
  markdown: ^7.2.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
