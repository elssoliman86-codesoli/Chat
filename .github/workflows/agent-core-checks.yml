name: Omni Chat Agent Core Checks

on:
  push:
    branches:
      - feature/omni-chat-agent-core
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
