name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up the release signing key
        # So every build is signed the same way and installs over the last one as an update, instead of
        # needing an uninstall every time. Only acts once the ANDROID_KEYSTORE_BASE64 secret is set;
        # until then the build falls back to debug signing. (GitHub Actions does not allow the `secrets`
        # context inside an `if:` condition, so the check happens inside the script instead.)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.codesoli --project-name omni_chat --no-pub .
          for p in lib pubspec.yaml analysis_options.yaml test; do
            git checkout -- "$p" || true
          done
          bash tool/patch_android.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build release APK
        # The build number must go up on every release or Android refuses to install it as an update
        # over the previous one (it uses the run number, so it always matches the build-N release tag).
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}

      - name: Prepare APK file
        run: cp build/app/outputs/flutter-apk/app-release.apk omni-chat.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ format('build-{0}', github.run_number) }}
          name: ${{ format('Omni Chat build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: omni-chat.apk
          generate_release_notes: true
          make_latest: true
