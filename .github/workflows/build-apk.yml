name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.codesoli --project-name omni_chat --no-pub .
          for p in lib pubspec.yaml analysis_options.yaml test; do
            git checkout -- "$p" || true
          done
          bash tool/patch_android.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare APK file
        run: cp build/app/outputs/flutter-apk/app-release.apk omni-chat.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ format('build-{0}', github.run_number) }}
          name: ${{ format('Omni Chat build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: omni-chat.apk
          generate_release_notes: true
          make_latest: true
